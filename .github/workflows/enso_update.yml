name: ENSO Watch Auto-Update

on:
  schedule:
    # NOAA updates ONI around the 8th of each month
    # Run on the 9th, 15th, and 22nd to catch any delays
    - cron: '0 6 9,15,22 * *'
  workflow_dispatch:  # manual trigger
  push:
    paths:
      - 'enso_auto_update.py'
      - 'enso_saddle_monitor.py'
      - 'enso_curl_monitor.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install numpy scipy netCDF4 xarray cdsapi
      
      - name: Run ENSO auto-update (ONI 1D)
        run: python enso_auto_update.py
      
      - name: Run Saddle Monitor (OISST anomaly, 免 key)
        run: python enso_saddle_monitor.py
        continue-on-error: true   # OPeNDAP 偶爾唔穩，唔好成個 workflow 死
      
      - name: Run Curl Monitor (ERA5 wind stress curl, 需 CDS key)
        run: python enso_curl_monitor.py
        continue-on-error: true   # CDS 下載慢/排隊，失敗唔好成個 workflow 死
        env:
          CDS_URL: ${{ secrets.CDS_URL }}
          CDS_KEY: ${{ secrets.CDS_KEY }}
      
      - name: Commit & push if changed
        run: |
          git config user.name "ENSO Watch Bot"
          git config user.email "enso-watch@github.com"
          # 只 add 實際存在嘅監測輸出（curl_data.json 喺未設 CDS key 時唔會產生）
          git add dashboard_data.json saddle_data.json saddle_history.json
          if [ -f curl_data.json ]; then git add curl_data.json; fi
          if [ -f curl_history.json ]; then git add curl_history.json; fi
          if git diff --cached --quiet; then
            echo "No changes. ENSO status unchanged."
          else
            git commit -m "🔄 ENSO auto-update $(date +%Y-%m-%d)"
            git push
            echo "✅ Updated and pushed."
          fi
