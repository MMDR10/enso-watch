<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌊 聖嬰預警看板 — 一睇就明</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e6f0;min-height:100vh;display:flex;justify-content:center;padding:16px}
.dashboard{max-width:680px;width:100%}
.header{text-align:center;padding:24px 0 8px}
.header h1{font-size:1.6rem;font-weight:700;color:#fff}
.header .sub{font-size:.8rem;color:#6b7280;margin-top:4px}
.card{background:#111827;border-radius:16px;padding:20px;margin-bottom:14px;border:1px solid #1f2937}
.card-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin-bottom:12px}
.warning-box{text-align:center;padding:28px 20px}
.warning-light{font-size:4rem;margin-bottom:8px}
.warning-level{font-size:1.4rem;font-weight:700;margin-bottom:4px}
.warning-detail{font-size:.82rem;color:#9ca3af;line-height:1.5}
.oni-big{font-size:3.2rem;font-weight:800;text-align:center;padding:8px 0}
.oni-label{text-align:center;font-size:.82rem;color:#6b7280}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#1a2235;border-radius:10px;padding:14px;text-align:center}
.metric .val{font-size:1.5rem;font-weight:700}
.metric .lbl{font-size:.68rem;color:#6b7280;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.detector-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1f2937;font-size:.85rem}
.detector-row:last-child{border-bottom:none}
.detector-row .name{font-weight:600;color:#d1d5db;min-width:130px}
.detector-row .val{font-family:monospace;font-size:.78rem;color:#9ca3af;flex:1;text-align:center}
.badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;text-align:center;min-width:64px}
.badge-red{background:#7f1d1d;color:#fca5a5}
.badge-orange{background:#78350f;color:#fcd34d}
.badge-yellow{background:#713f12;color:#fde047}
.badge-green{background:#14532d;color:#86efac}
.badge-grey{background:#374151;color:#9ca3af}
.timeline{font-size:.75rem;color:#6b7280;text-align:center;padding:8px}
.multiscale-bar{display:flex;gap:4px;align-items:flex-end;height:80px;margin:10px 0}
.ms-bar{flex:1;border-radius:3px 3px 0 0;position:relative;min-width:8px}
.ms-bar-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:.58rem;color:#6b7280;white-space:nowrap}
.d2h-box{background:#1a2235;border-radius:10px;padding:16px;text-align:center;margin:10px 0}
.d2h-box .big{font-size:1.8rem;font-weight:800}
.d2h-box .sub{font-size:.72rem;color:#6b7280;margin-top:4px}
.explain{font-size:.75rem;color:#6b7280;line-height:1.6;margin-top:8px;padding:10px;background:#0f172a;border-radius:8px}

/* Vortex depth bar */
.vortex-bar-wrap{display:flex;gap:12px;align-items:center;margin:10px 0}
.vortex-label{font-size:.68rem;color:#6b7280;width:48px;text-align:right}
.vortex-track{flex:1;height:24px;background:#1a2235;border-radius:12px;position:relative;overflow:hidden}
.vortex-fill-core{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#ef4444,#f97316);border-radius:12px 0 0 12px;transition:width .5s}
.vortex-fill-shell{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);border-radius:0 12px 12px 0;transition:width .5s}
.vortex-val{font-family:monospace;font-size:.78rem;font-weight:600;width:42px;text-align:center}

/* 1996 comparison box */
.compare-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.compare-col{background:#1a2235;border-radius:10px;padding:12px;text-align:center}
.compare-col .label{font-size:.65rem;color:#6b7280;text-transform:uppercase;letter-spacing:.05em}
.compare-col .year{font-size:.7rem;color:#9ca3af;margin-bottom:4px}
.compare-col .val{font-family:monospace;font-size:.85rem;font-weight:700}
.compare-col .hint{font-size:.62rem;color:#6b7280;margin-top:2px}
.compare-arrow{text-align:center;font-size:1.2rem;color:#6b7280;padding:4px}
footer{text-align:center;padding:16px;font-size:.7rem;color:#4b5563}
a{color:#60a5fa}
.spinner{width:30px;height:30px;border:3px solid #1f2937;border-top:3px solid #60a5fa;border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="dashboard" id="app">
<div class="spinner" id="loading"></div>
</div>
<footer>數據來源：美國 NOAA · 每月自動更新 · <span id="genTime"></span> · <a href="https://github.com/MMDR10/enso-watch" target="_blank">GitHub</a></footer>

<script>
async function load() {
  try {
    const r = await fetch('dashboard_data.json');
    const d = await r.json();
    render(d);
  } catch(e) {
    document.getElementById('app').innerHTML = 
      '<div class="card" style="text-align:center;padding:40px"><p>⚠️ 無法載入數據</p><p style="font-size:.8rem;color:#6b7280">請檢查網絡連接後重新整理</p></div>';
  }
}

function render(d) {
  const phaseEmoji = {'El Niño':'🔴 聖嬰','La Niña':'🔵 反聖嬰','Neutral':'⚪ 正常'};
  
  const phaseExplain = {
    'El Niño': '太平洋赤道海域異常偏暖，通常帶來極端天氣（暴雨、乾旱、颱風路徑改變）',
    'La Niña': '太平洋赤道海域異常偏冷，通常帶來相反的天氣模式',
    'Neutral': '海水溫度在正常範圍內，沒有異常信號'
  };
  
  // Multiscale bar heights
  const ms = d.detector_a_multiscale.window_sweep;
  const dhVals = Object.entries(ms).map(([w,v])=>[parseInt(w),v.dh_latest]).sort((a,b)=>a[0]-b[0]);
  const maxAbs = Math.max(...dhVals.map(v=>Math.abs(v[1])), 0.5);
  
  let msBars = dhVals.map(([w,v])=>{
    const h = Math.abs(v)/maxAbs*60;
    const color = v<0 ? '#ef4444' : '#22c55e';
    const y = v<0 ? 60-h : 60;
    const yr = Math.round(w/12*10)/10;
    return `<div class="ms-bar" style="height:${h}px;background:${color};margin-top:${y}px">
      <span class="ms-bar-label">${yr}年</span></div>`;
  }).join('');
  
  const detA = d.detector_a_multiscale;
  const detC = d.detector_c_gaussianity;
  const detD = d.detector_d_theta1;
  const detB = d.detector_b_chi_eff;
  const vx = d.vortex;
  const cmp = vx && vx.comparison_1996;
  
  // composite plain text
  const compositeText = {
    'CLEAR': '一切正常 — 四項指標均無異常',
    'WATCH': '持續觀察 — 有指標出現輕微變化，建議留意',
    'WARNING': '高度警戒 — 多項指標異常，聖嬰可能正在形成',
    'CRITICAL': '極度危險 — 強聖嬰信號明確，請做好防災準備'
  };
  const compKey = d.composite.includes('CLEAR') ? 'CLEAR' : d.composite.includes('CRITICAL') ? 'CRITICAL' : d.composite.includes('WARNING') ? 'WARNING' : 'WATCH';
  
  const detAExplain = {
    'SHEAR INVERSION': '海底暖水正在上升，海面尚無反應。<br>這通常是聖嬰來臨前的早期信號，類似「海底暗流已經動了，海面仲未起浪」。<br>歷史平均提前約 <b>4.4 年</b>預警。',
    'DEEP ACCUMULATION': '海洋熱量穩定累積中，目前沒有異常信號。',
    'FULL REGIME SHIFT': '全海洋熱量異常上升 — 強聖嬰極可能已經展開。'
  };
  
  // Vortex bar: normalize H_core and H_shell to fit track
  const hmax = Math.max(vx ? Math.max(vx.h_core, vx.h_shell) : 2, 2);
  const corePct = vx ? Math.min(vx.h_core / hmax * 100, 100) : 50;
  const shellPct = vx ? Math.min(vx.h_shell / hmax * 100, 100) : 50;
  const vInverted = vx && vx.delta_h < 0;
  
  document.getElementById('app').innerHTML = `
<div class="header">
  <h1>🌊 聖嬰預警看板</h1>
  <div class="sub">一眼睇明 · 唔需要科學背景 · ${d.generated}</div>
</div>

<!-- 咩係聖嬰 -->
<div class="card">
  <div class="card-title">📖 咩係聖嬰？</div>
  <div class="explain">
    聖嬰現象（El Niño）係太平洋赤道附近海水<b>異常變暖</b>嘅自然現象，每隔 2-7 年發生一次。<br>
    佢會令全球天氣大亂：東南亞乾旱、南美暴雨、颱風路徑改變、農作物失收。<br>
    呢個看板用 <b>四個獨立指標</b> 幫你提早睇到聖嬰來臨嘅信號。
  </div>
</div>

<!-- 現在溫度 -->
<div class="card">
  <div class="card-title">🌡️ 目前太平洋赤道海水溫度</div>
  <div class="oni-big" style="color:${d.latest.oni>=0.5?'#ef4444':d.latest.oni<=-0.5?'#3b82f6':'#9ca3af'}">
    ${d.latest.oni>=0?'偏高 ':''}${d.latest.oni<=-0.5?'偏低 ':''}${Math.abs(d.latest.oni).toFixed(1)}°C
  </div>
  <div class="oni-label">${d.latest.date} · ${phaseEmoji[d.latest.oni_phase]}</div>
  <div class="explain">${phaseExplain[d.latest.oni_phase]}</div>
</div>

<!-- 總體判定 -->
<div class="card warning-box" style="border-color:${d.composite.includes('CLEAR')?'#14532d':d.composite.includes('CRITICAL')?'#7f1d1d':'#713f12'}">
  <div class="warning-light">${d.composite.includes('CLEAR')?'🟢':d.composite.includes('CRITICAL')?'🔴':'🟡'}</div>
  <div class="warning-level" style="color:${d.composite.includes('CLEAR')?'#86efac':d.composite.includes('CRITICAL')?'#fca5a5':'#fde047'}">${d.composite.includes('CLEAR')?'一切正常':d.composite.includes('CRITICAL')?'極度危險':d.composite.includes('WARNING')?'高度警戒':'持續觀察'}</div>
  <div class="warning-detail">${compositeText[compKey]}</div>
</div>

<!-- 最重要的指標：海洋熱量變化 -->
<div class="card">
  <div class="card-title">🔬 最重要指標 — 海洋熱量趨勢</div>
  <div class="explain" style="margin-bottom:10px">
    呢個指標睇海洋由淺到深嘅<b>熱量變化方向</b>。綠色 = 熱量正常散走，紅色 = 熱量開始累積。<br>
    當短期（1年）開始變紅、長期（5年）仲係綠色，代表「海底暗流已動」— 係最關鍵嘅早期信號。
  </div>
  <div class="multiscale-bar">${msBars}</div>
  <div style="text-align:center;font-size:.68rem;color:#4b5563;margin-top:20px">← 短週期（近期變化）　　　　　　　　長週期（長期趨勢）→</div>
  <div class="d2h-box">
    <div class="big" style="color:${detA.d2h<0?'#ef4444':'#22c55e'}">熱量趨勢指數 ${detA.d2h>0?'+':''}${detA.d2h.toFixed(3)}</div>
    <div class="sub">近 1 年變化 ${detA.dh_short>0?'+':''}${detA.dh_short.toFixed(3)} · 近 5 年變化 ${detA.dh_long>0?'+':''}${detA.dh_long.toFixed(3)}</div>
  </div>
  <div style="text-align:center;margin-top:8px">
    <span class="badge badge-${detA.level}">${detA.emoji}</span>
    <div class="explain">${detAExplain[detA.state] || ''}</div>
  </div>
</div>

<!-- 渦流深度 — NEW VORTEX CARD -->
${vx ? `
<div class="card">
  <div class="card-title">🌪️ 海底渦流深度 — 聖嬰引擎</div>
  <div class="explain" style="margin-bottom:10px">
    用衛星數據拆解海洋<b>深層（核心）</b>同<b>表層（外殼）</b>嘅渦流強度。<br>
    🔴 核心（紅）> 🔵 外殼（藍）代表「海底暗流已動」— 聖嬰來臨前嘅關鍵信號。
  </div>
  
  <!-- Core depth bar -->
  <div class="vortex-bar-wrap">
    <span class="vortex-label">🔴 深層</span>
    <div class="vortex-track">
      <div class="vortex-fill-core" style="width:${corePct}%"></div>
    </div>
    <span class="vortex-val" style="color:#f97316">${vx.h_core.toFixed(2)}</span>
  </div>
  <div class="vortex-bar-wrap">
    <span class="vortex-label">🔵 表層</span>
    <div class="vortex-track">
      <div class="vortex-fill-shell" style="width:${shellPct}%"></div>
    </div>
    <span class="vortex-val" style="color:#6366f1">${vx.h_shell.toFixed(2)}</span>
  </div>
  
  <!-- ΔH verdict -->
  <div class="d2h-box" style="border:1px solid ${vInverted?'#ef4444':'#22c55e'}40">
    <div class="big" style="color:${vInverted?'#ef4444':'#22c55e'}">ΔH = ${vx.delta_h>0?'+':''}${vx.delta_h.toFixed(2)}</div>
    <div class="sub" style="color:${vInverted?'#fca5a5':'#86efac'}">
      ${vInverted ? '⚠️ 深層渦流高於表層 — 海底暗流已動' : '✅ 表層渦流主導 — 海底平靜'}
    </div>
  </div>
  <div class="explain">
    <b>點睇？</b> ΔH = 表層 − 深層。正常時 ΔH 為正（表層活躍）。當 ΔH 變負 = 深層渦流強過表層 = 熱量由海底向上輸送。<br>
    呢個係 <b>1997 超級聖嬰</b>嚟臨前 6 個月出現過嘅經典信號。
  </div>
</div>
` : ''}

<!-- 1996 對比框 -->
${cmp ? `
<div class="card">
  <div class="card-title">⏳ 歷史對比：1996.5 → 1997 超級聖嬰</div>
  <div class="compare-box">
    <div class="compare-col">
      <div class="label">📅 1996 年 5 月</div>
      <div class="year">超級聖嬰前夕</div>
      <div class="val" style="color:#ef4444">ΔH = ${cmp.delta_h.toFixed(2)}</div>
      <div class="hint">深層渦流潛入</div>
    </div>
    <div class="compare-col">
      <div class="label">📅 而家</div>
      <div class="year">${d.latest.date}</div>
      <div class="val" style="color:${vInverted?'#ef4444':'#22c55e'}">ΔH = ${vx? vx.delta_h>0?'+':''+vx.delta_h.toFixed(2) : '--'}</div>
      <div class="hint">${vInverted?'⚠️ 信號相似！':'✅ 正常'}</div>
    </div>
  </div>
  <div class="explain">
    <b>1997 超級聖嬰</b>係近代最強嘅聖嬰事件之一。1996 年 5 月，ΔH 跌至 <b>${cmp.delta_h.toFixed(2)}</b>（深層渦流強於表層），6 個月後爆發。<br>
    呢個對比框幫你睇而家嘅渦流狀態同嗰次有幾似。
  </div>
</div>
` : ''}

<!-- 四大指標一覽 -->
<div class="card">
  <div class="card-title">📊 四大預警指標</div>
  <div class="detector-row">
    <span class="name">🌡️ 海洋熱量趨勢</span>
    <span class="val">指數 ${detA.d2h>0?'+':''}${detA.d2h.toFixed(3)}</span>
    <span class="badge badge-${detA.level}">${detA.emoji}</span>
  </div>
  <div class="detector-row">
    <span class="name">🏗️ 氣候系統穩定度</span>
    <span class="val">數值 ${detB.value.toFixed(1)}（愈低愈穩定）</span>
    <span class="badge badge-${detB.level}">✅</span>
  </div>
  <div class="detector-row">
    <span class="name">🌊 洋流協調性</span>
    <span class="val">${detC.qq_r.toFixed(2)}（愈接近 1.0 愈正常）</span>
    <span class="badge badge-${detC.level}">${detC.level==='green'?'🟢':detC.level==='yellow'?'🟡':'🔴'}</span>
  </div>
  <div class="detector-row">
    <span class="name">🧭 洋流結構穩定度</span>
    <span class="val">${detD.value.toFixed(1)}°（愈細愈穩定）</span>
    <span class="badge badge-${detD.level}">${detD.level==='green'?'🟢':detD.level==='yellow'?'🟡':'🔴'}</span>
  </div>
  <div class="explain" style="margin-top:10px">
    <b>點睇？</b><br>
    🟢 四項全綠 → 放心，冇聖嬰信號<br>
    🟡 有一兩項變黃 → 留意，可能醞釀中<br>
    🔴 有紅 → 聖嬰信號強烈，早做準備
  </div>
</div>

<!-- 長期參考數值 -->
<div class="card">
  <div class="card-title">📈 長期參考數值</div>
  <div class="metrics">
    <div class="metric"><div class="val">${d.history.H_mean.toFixed(2)}</div><div class="lbl">海洋熱含量（歷年平均）</div></div>
    <div class="metric"><div class="val">${d.history.theta1_latest.toFixed(1)}°</div><div class="lbl">洋流結構角（愈細愈穩定）</div></div>
    <div class="metric"><div class="val">${d.history.chi_eff.toFixed(1)}</div><div class="lbl">系統穩定度（愈低愈好）</div></div>
    <div class="metric"><div class="val">${detC.qq_r.toFixed(2)}</div><div class="lbl">洋流協調性（1.0 = 最正常）</div></div>
  </div>
</div>
`;
  document.getElementById('genTime').textContent = d.generated;
}

load();
</script>
</body>
</html>
